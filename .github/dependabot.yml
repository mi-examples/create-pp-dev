version: 2
updates:
  # The package itself. Runtime dependencies ship to users, so their updates
  # are commits of type fix and release a patch; development dependencies
  # don't release.
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'daily'
    commit-message:
      prefix: 'fix'
      prefix-development: 'chore'
      include: 'scope'

  # The project templates. Every dependency in them ships in each scaffolded
  # project, so an update is a fix and releases a patch. Ranges are raised to
  # the new version. Updates arrive as at most three pull requests for all
  # templates together (a dependency joins the first group it matches):
  #   - pp-dev on its own;
  #   - every other minor and patch update;
  #   - every other major update, separately, since those can need changes to
  #     the templates.
  - package-ecosystem: 'npm'
    directories: ['/template-*']
    target-branch: 'develop'
    versioning-strategy: increase
    schedule:
      interval: 'daily'
    commit-message:
      prefix: 'fix'
      include: 'scope'
    groups:
      pp-dev:
        patterns: ['@metricinsights/pp-dev']
      templates:
        patterns: ['*']
        update-types: ['minor', 'patch']
      templates-major:
        patterns: ['*']
        update-types: ['major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns: ['*']
