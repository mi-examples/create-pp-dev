version: 2
updates:
  # The package itself. Runtime dependencies ship to users, so their updates
  # are commits of type fix and release a patch; development dependencies
  # don't release.
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'daily'
    commit-message:
      prefix: 'fix'
      prefix-development: 'chore'
      include: 'scope'
    ignore:
      # TypeScript 7 conflicts with the typescript-eslint peer range
      # (>=4.8.4 <6.1.0) in the templates and here. Remove this once
      # typescript-eslint supports it.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # The project templates. Every dependency in them ships in each scaffolded
  # project, so an update is a fix and releases a patch. Ranges are raised to
  # the new version. Updates arrive as at most two pull requests for all
  # templates together (a dependency joins the first group it matches):
  #   - pp-dev on its own, since its bump is usually made by hand with the
  #     release that needs it;
  #   - everything else in one group. A split by update type did not hold:
  #     with ranges raised rather than versions pinned, Dependabot filed
  #     minor and patch bumps under the "major" group (#356).
  - package-ecosystem: 'npm'
    directories: ['/template-*']
    target-branch: 'develop'
    versioning-strategy: increase
    schedule:
      interval: 'daily'
    commit-message:
      prefix: 'fix'
      include: 'scope'
    groups:
      pp-dev:
        patterns: ['@metricinsights/pp-dev']
      templates:
        patterns: ['*']
    ignore:
      # TypeScript 7 conflicts with the typescript-eslint peer range
      # (>=4.8.4 <6.1.0) in the templates and here. Remove this once
      # typescript-eslint supports it.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns: ['*']
